# Optional: run Postgres locally with Docker (external service = optional).
# The backend also works with a Postgres you install directly on Linux Mint.
services:
  postgres:
    image: postgres:15-alpine
    container_name: projectplanner-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: projectplanner
    ports:
      - "5432:5432"
    volumes:
      - projectplanner_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  projectplanner_data:
